server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript application/wasm application/octet-stream text/css application/json image/svg+xml;

  location /media/ { expires 7d; }
  location /img/ { expires 7d; }
  location /fonts/ { expires 30d; }

  location / {
    try_files $uri $uri/ =404;
  }
}
